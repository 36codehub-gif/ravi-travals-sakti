
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>व्यापारी - Business Tycoon</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:18px;background:#182438;border-bottom:2px solid #eabf4b}
h1{margin:0;color:#f5c451;font-size:32px}
header p{color:#b7c5d8;margin:7px 0 0}
.container{max-width:1100px;margin:auto;padding:15px}
.panel{background:#1b2a40;border:1px solid #ffffff20;border-radius:15px;padding:15px;margin-bottom:15px}
input,select{width:100%;padding:11px;margin:6px 0 12px;background:#101827;color:white;border:1px solid #53657e;border-radius:8px}
button{background:#f5c451;color:#172033;border:0;padding:12px 17px;border-radius:9px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
.secondary{background:#40536d;color:white}
.hidden{display:none}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:#101827;padding:10px;border-radius:9px;flex:1;min-width:120px}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tile{background:#293b52;border:1px solid #ffffff25;border-radius:8px;min-height:90px;padding:7px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px;position:relative}
.tile strong{font-size:12px}
.tile small{color:#f5c451}
.tile.current{outline:3px solid #f5c451}
.tile .owner{color:#75e2b2;font-size:10px}
.tile .tokens{font-size:16px}
.center{grid-column:2/6;grid-row:2/6;background:#142238;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:15px;min-height:220px}
.center h2{color:#f5c451}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.player{background:#101827;padding:10px;border-radius:9px;border-left:5px solid #f5c451}
.log{height:170px;overflow:auto;background:#101827;padding:10px;border-radius:9px;font-size:13px}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px}
.dialog{background:#1b2a40;padding:22px;border-radius:15px;width:min(420px,100%);border:1px solid #ffffff30}
.dialog h2{color:#f5c451}
@media(max-width:600px){
 .container{padding:8px}.tile{min-height:75px;padding:4px;font-size:10px}
 .tile strong{font-size:10px}.center{min-height:160px;padding:7px}
 .board{gap:3px}
}
</style>
</head>
<body>
<header>
<h1>💼 व्यापारी</h1>
<p>खरीदो • किराया कमाओ • कारोबार बढ़ाओ</p>
</header>

<div class="container">
<section class="panel" id="setup">
<h2>नया गेम शुरू करें</h2>
<label>खिलाड़ियों की संख्या</label>
<select id="count">
<option value="2">2 खिलाड़ी</option>
<option value="3">3 खिलाड़ी</option>
<option value="4">4 खिलाड़ी</option>
</select>
<div id="nameInputs"></div>
<button onclick="startGame()">गेम शुरू करें ▶</button>
</section>

<section id="game" class="hidden">
<div class="panel">
<div class="stats">
<div class="stat">🎯 <b id="turn">खिलाड़ी की बारी</b></div>
<div class="stat">🔄 राउंड: <b id="round">1</b></div>
<div class="stat">🎲 पासा: <b id="dice">-</b></div>
</div>
<div class="board" id="board"></div>
<div class="actions">
<button id="roll" onclick="rollDice()">🎲 पासा फेंको</button>
<button id="next" class="secondary" onclick="nextTurn()" disabled>अगली बारी →</button>
<button class="secondary" onclick="rules()">नियम</button>
</div>
</div>

<div class="panel">
<h3>👥 खिलाड़ी और उनकी पूंजी</h3>
<div class="players" id="players"></div>
</div>

<div class="panel">
<h3>📢 कारोबार की खबरें</h3>
<div class="log" id="log"></div>
</div>
</section>
</div>

<div class="modal" id="modal">
<div class="dialog">
<h2 id="modalTitle"></h2>
<p id="modalText"></p>
<div class="actions" id="modalActions"></div>
</div>
</div>

<script>
const places=[
{name:"शुरुआत",type:"start"},
{name:"चाय दुकान",price:800,rent:120,color:"#d97706"},
{name:"भाग्य कार्ड",type:"chance"},
{name:"सब्जी मंडी",price:1000,rent:150,color:"#65a30d"},
{name:"नगर कर",type:"tax",value:500},
{name:"बस स्टैंड",price:1400,rent:180,color:"#0ea5e9"},
{name:"किराना स्टोर",price:1600,rent:220,color:"#a78bfa"},
{name:"भाग्य कार्ड",type:"chance"},
{name:"मोबाइल शॉप",price:1900,rent:260,color:"#ec4899"},
{name:"होटल",price:2300,rent:320,color:"#f97316"},
{name:"आराम गृह",type:"rest"},
{name:"कपड़ा दुकान",price:2600,rent:360,color:"#14b8a6"},
{name:"पेट्रोल पंप",price:3000,rent:420,color:"#eab308"},
{name:"नगर कर",type:"tax",value:700},
{name:"सिनेमा हॉल",price:3400,rent:480,color:"#8b5cf6"},
{name:"भाग्य कार्ड",type:"chance"},
{name:"गोदाम",price:3800,rent:550,color:"#64748b"},
{name:"फैक्ट्री",price:4300,rent:650,color:"#ef4444"},
{name:"आराम गृह",type:"rest"},
{name:"शॉपिंग मॉल",price:4800,rent:750,color:"#06b6d4"},
{name:"आईटी कंपनी",price:5500,rent:900,color:"#22c55e"},
{name:"भाग्य कार्ड",type:"chance"},
{name:"होटल चेन",price:6200,rent:1050,color:"#f43f5e"},
{name:"लक्जरी रिसॉर्ट",price:7000,rent:1250,color:"#c084fc"}
];

let players=[],turn=0,round=1,rolled=false,finished=false;
const $=id=>document.getElementById(id);

function makeInputs(){
 $("nameInputs").innerHTML="";
 for(let i=1;i<=4;i++){
  let label=document.createElement("label");
  label.textContent="खिलाड़ी "+i+" का नाम";
  let input=document.createElement("input");
  input.id="name"+i;
  input.value=["","आप","दोस्त","खिलाड़ी 3","खिलाड़ी 4"][i];
  if(i>2)input.className="optional";
  $("nameInputs").append(label,input);
 }
}
$("count").addEventListener("change",makeInputs);
makeInputs();

function startGame(){
 let count=+$("count").value;
 const colors=["#4da3ff","#ff6b6b","#43d19e","#c084fc"];
 players=[];
 for(let i=1;i<=count;i++){
  players.push({
   name:$("name"+i).value.trim()||"खिलाड़ी "+i,
   cash:10000,pos:0,props:[],color:colors[i-1],alive:true
  });
 }
 turn=0;round=1;rolled=false;finished=false;
 $("setup").classList.add("hidden");
 $("game").classList.remove("hidden");
 log("नया गेम शुरू हुआ! सभी को ₹10,000 मिले।");
 render();
}

function render(){
 $("turn").textContent=players[turn].name;
 $("round").textContent=round;
 $("players").innerHTML=players.map((p,i)=>`
 <div class="player" style="border-color:${p.color}">
 <b>${safe(p.name)}</b><br>
 💰 ₹${p.cash.toLocaleString("en-IN")}<br>
 <small>संपत्ति: ${p.props.length} ${p.alive?"":"| दिवालिया"}</small>
 </div>`).join("");

 $("board").innerHTML=places.map((s,i)=>{
  let owner=players.find(p=>p.props.includes(i));
  let tokens=players.filter(p=>p.alive&&p.pos===i)
    .map(p=>`<span style="color:${p.color}">●</span>`).join("");
  return `<div class="tile ${players[turn].pos===i?"current":""}">
   <div style="height:5px;background:${owner?owner.color:s.color||"#718096"};border-radius:5px"></div>
   <strong>${s.name}</strong>
   <small>${s.price?"कीमत ₹"+s.price:s.type==="tax"?"कर ₹"+s.value:""}</small>
   <span class="owner">${owner?"मालिक: "+safe(owner.name):""}</span>
   <div class="tokens">${tokens}</div>
  </div>`;
 }).join("");

 $("roll").disabled=rolled||finished;
 $("next").disabled=!rolled||finished;
}

function rollDice(){
 if(rolled||finished)return;
 rolled=true;
 let p=players[turn],dice=1+Math.floor(Math.random()*6);
 $("dice").textContent=dice;
 let old=p.pos;
 p.pos=(p.pos+dice)%places.length;
 if(p.pos<old){
  p.cash+=1500;
  log(p.name+" ने शुरुआत पार की और ₹1,500 बोनस पाया!");
 }
 log(p.name+" ने "+dice+" फेंका और "+places[p.pos].name+" पर पहुँचा।");
 resolve(p);
 render();
}

function resolve(p){
 let s=places[p.pos],owner=players.find(x=>x.props.includes(p.pos));
 if(s.price){
  if(!owner){
   show("नई प्रॉपर्टी!",s.name+" की कीमत ₹"+s.price+" है। क्या खरीदना चाहते हैं?",[
    ["खरीदें",()=>{
     if(p.cash>=s.price){
      p.cash-=s.price;p.props.push(p.pos);
      log(p.name+" ने "+s.name+" खरीदा।");
     }else log("पर्याप्त पैसे नहीं हैं!");
     close();render();
    }],
    ["नहीं",close]
   ]);
  }else if(owner!==p){
   p.cash-=s.rent;owner.cash+=s.rent;
   log(p.name+" ने "+owner.name+" को ₹"+s.rent+" किराया दिया।");
   checkBankrupt(p);
  }else log("आप अपनी ही प्रॉपर्टी पर आए हैं।");
 }
 else if(s.type==="tax"){
  p.cash-=s.value;
  log(p.name+" ने ₹"+s.value+" नगर कर दिया।");
  checkBankrupt(p);
 }
 else if(s.type==="chance"){
  let cards=[
   ["बड़ा ऑर्डर मिला",1200],["गाड़ी की मरम्मत",-700],
   ["पुराना उधार वापस",900],["मार्केट में नुकसान",-1000],
   ["त्योहार की बिक्री",1500],["बिजली बिल",-450]
  ];
  let c=cards[Math.floor(Math.random()*cards.length)];
  p.cash+=c[1];
  log(p.name+": "+c[0]+" ("+(c[1]>0?"+":"")+"₹"+c[1]+")");
  checkBankrupt(p);
  show("भाग्य कार्ड",c[0]+"। "+(c[1]>0?"आपको ":"आपके खाते से ")+"₹"+Math.abs(c[1])+(c[1]>0?" मिले।":" कटे।"),[["ठीक है",close]]);
 }else if(s.type==="rest"){
  log(p.name+" ने आराम किया।");
 }
}

function checkBankrupt(p){
 if(p.cash>=0)return;
 p.alive=false;
 p.props.forEach(i=>{});
 p.props=[];
 log(p.name+" दिवालिया हो गया!");
 let alive=players.filter(x=>x.alive);
 if(alive.length===1){
  finished=true;
  show("🏆 विजेता!",alive[0].name+" ने व्यापारी गेम जीत लिया!",[
   ["नया गेम",()=>location.reload()]
  ]);
 }
}

function nextTurn(){
 if(!rolled)return;
 rolled=false;
 let next=turn;
 do{
  next=(next+1)%players.length;
  if(next===0)round++;
 }while(!players[next].alive);
 turn=next;
 $("dice").textContent="-";
 render();
}

function log(message){
 let div=document.createElement("div");
 div.textContent="• "+message;
 $("log").prepend(div);
}

function show(title,message,buttons){
 $("modalTitle").textContent=title;
 $("modalText").textContent=message;
 $("modalActions").innerHTML="";
 buttons.forEach(([label,action],i)=>{
  let b=document.createElement("button");
  b.textContent=label;
  if(i)b.className="secondary";
  b.onclick=action;
  $("modalActions").appendChild(b);
 });
 $("modal").style.display="flex";
}
function close(){$("modal").style.display="none"}

function rules(){
 show("गेम के नियम",
 "1. हर खिलाड़ी को ₹10,000 मिलते हैं। 2. पासा फेंककर आगे बढ़ें। 3. खाली दुकान या जगह खरीदें। 4. दूसरे की प्रॉपर्टी पर किराया दें। 5. शुरुआत पार करने पर ₹1,500 बोनस। 6. टैक्स और भाग्य कार्ड का असर लागू होगा। 7. आखिरी बचा खिलाड़ी विजेता है।",
 [["समझ गया",close]]);
}
function safe(value){
 return String(value).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fashion Photo Editor</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial}
header{text-align:center;padding:20px;background:#1c2d45}
h1{color:#f5c451;margin:0}
main{max-width:700px;margin:20px auto;padding:15px}
.box{background:#1b2b42;padding:18px;border-radius:15px}
button{padding:12px 16px;margin:5px;border:0;border-radius:8px;background:#f5c451;font-weight:bold;cursor:pointer}
.secondary{background:#40536d;color:white}
input[type=file]{width:100%;margin:15px 0}
canvas,video{width:100%;height:auto;background:#27374c;border-radius:10px;margin-top:15px}
video{display:none}
.controls{margin-top:15px}
</style>
</head>
<body>
<header>
<h1>👔 Fashion Photo Editor</h1>
<p>Upload • Edit • Download</p>
</header>

<main>
<div class="box">
<h3>अपनी फोटो चुनें</h3>
<input type="file" id="file" accept="image/*">

<div>
<button onclick="startCamera()">📷 Camera</button>
<button onclick="capture()">Capture</button>
<button class="secondary" onclick="stopCamera()">Stop Camera</button>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="controls">
<h3>Photo Filters</h3>
<button onclick="filter('none')">Original</button>
<button onclick="filter('grayscale(100%)')">B&W</button>
<button onclick="filter('sepia(80%)')">Vintage</button>
<button onclick="filter('brightness(120%)')">Bright</button>
<button onclick="filter('contrast(140%)')">Contrast</button>
</div>

<div class="controls">
<button class="secondary" onclick="resetImage()">Reset</button>
<button onclick="download()">⬇ Download Photo</button>
</div>
</div>
</main>

<script>
const fileInput=document.getElementById("file");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const video=document.getElementById("video");

let image=null;
let stream=null;
let selectedFilter="none";

fileInput.addEventListener("change",function(){
 const file=this.files[0];
 if(!file)return;

 const reader=new FileReader();
 reader.onload=function(e){
  const img=new Image();
  img.onload=function(){
   image=img;
   canvas.width=img.naturalWidth;
   canvas.height=img.naturalHeight;
   draw();
  };
  img.src=e.target.result;
 };
 reader.readAsDataURL(file);
});

function draw(){
 if(!image)return;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.filter=selectedFilter;
 ctx.drawImage(image,0,0,canvas.width,canvas.height);
 ctx.filter="none";
}

function filter(value){
 if(!image)return alert("पहले फोटो अपलोड करें");
 selectedFilter=value;
 draw();
}

async function startCamera(){
 try{
  if(!navigator.mediaDevices?.getUserMedia){
   alert("Camera के लिए HTTPS या localhost पर खोलें।");
   return;
  }
  stopCamera();
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:"environment"},
   audio:false
  });
  video.srcObject=stream;
  video.style.display="block";
  await video.play();
 }catch(error){
  alert("Camera permission दें। "+error.message);
 }
}

function capture(){
 if(!stream || !video.videoWidth){
  alert("पहले Camera चालू करें");
  return;
 }
 const img=new Image();
 canvas.width=video.videoWidth;
 canvas.height=video.videoHeight;
 ctx.filter="none";
 ctx.drawImage(video,0,0,canvas.width,canvas.height);

 img.onload=function(){
  image=img;
  selectedFilter="none";
 };
 img.src=canvas.toDataURL("image/png");
 stopCamera();
}

function stopCamera(){
 if(stream){
  stream.getTracks().forEach(track=>track.stop());
  stream=null;
 }
 video.srcObject=null;
 video.style.display="none";
}

function resetImage(){
 if(!image)return alert("पहले फोटो अपलोड करें");
 selectedFilter="none";
 draw();
}

function download(){
 if(!canvas.width)return alert("पहले फोटो अपलोड करें");
 const a=document.createElement("a");
 a.download="edited-photo.png";
 a.href=canvas.toDataURL("image/png");
 a.click();
}
</script>
</body>
</html>

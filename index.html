
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Tabla Studio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #10131c;
    color: white;
    min-height: 100vh;
}

header {
    padding: 22px;
    text-align: center;
    background: linear-gradient(135deg,#171c2c,#29203c);
    border-bottom: 1px solid #353b50;
}

header h1 {
    color: #ffbd59;
    font-size: 30px;
    letter-spacing: 2px;
}

header p {
    color: #aaa;
    margin-top: 8px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px 15px;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: space-between;
    align-items: center;
    background: #1b2030;
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 30px;
}

button, select {
    border: none;
    border-radius: 8px;
    padding: 12px 17px;
    cursor: pointer;
    font-weight: bold;
}

button {
    background: #ffb94d;
    color: #171717;
}

button:hover {
    background: #ffd17d;
    transform: translateY(-2px);
}

.tempo {
    display: flex;
    gap: 12px;
    align-items: center;
}

input[type=range] {
    accent-color: #ffbd59;
    width: 120px;
}

.studio {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 65px;
    flex-wrap: wrap;
    padding: 35px 10px;
}

.drum {
    text-align: center;
    cursor: pointer;
    transition: .15s;
}

.drum:active, .drum.active {
    transform: scale(.94);
    filter: brightness(1.5);
}

.drum-head {
    width: 245px;
    height: 245px;
    border-radius: 50%;
    background:
    radial-gradient(circle at center,#181818 0 10%,#777 11% 14%,
    #242424 15% 25%,#d6a76a 26% 29%,
    #754326 30% 65%,#bd8550 66% 75%,#4c2919 76%);
    border: 9px solid #d29a5a;
    box-shadow: 0 12px 30px #0009,
    inset 0 0 15px #000;
    display: flex;
    justify-content: center;
    align-items: center;
}

.bayan .drum-head {
    width: 290px;
    height: 230px;
    border-radius: 50%;
    background:
    radial-gradient(circle at center,#151515 0 12%,#777 13% 16%,
    #252525 17% 27%,#d3b68a 28% 31%,
    #777 32% 68%,#b8a18a 69% 77%,#514638 78%);
    border: 10px solid #aeb6c4;
}

.drum-name {
    font-size: 23px;
    color: #ffbd59;
    margin-top: 20px;
    font-weight: bold;
}

.drum small {
    color: #aaa;
    display: block;
    margin-top: 7px;
}

.section {
    background: #1b2030;
    border-radius: 14px;
    padding: 22px;
    margin-top: 22px;
}

.section h2 {
    color: #ffbd59;
    margin-bottom: 17px;
}

.bols {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.bol {
    background: #30384b;
    color: white;
    min-width: 75px;
}

.bol:active {
    background: #ffbd59;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

select {
    background: #30384b;
    color: white;
}

#status {
    color: #73e5a0;
    margin-top: 15px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #888;
}

@media(max-width:600px) {
    .drum-head {
        width: 205px;
        height: 205px;
    }
    .bayan .drum-head {
        width: 235px;
        height: 190px;
    }
    .studio {
        gap: 45px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🥁 TABLA STUDIO</h1>
    <p>Professional Indian Percussion Simulator</p>
</header>

<div class="container">

    <div class="toolbar">
        <div class="tempo">
            <label>Tempo</label>
            <input type="range" id="tempo" min="40" max="220" value="90">
            <strong id="tempoValue">90 BPM</strong>
        </div>

        <div class="actions">
            <button onclick="toggleMetronome()" id="metroBtn">
                Metronome OFF
            </button>
            <button onclick="playBeat()">▶ Play Beat</button>
            <button onclick="stopBeat()">■ Stop</button>
        </div>
    </div>

    <div class="studio">

        <div class="drum" id="dayan" onclick="playTabla('na')">
            <div class="drum-head"></div>
            <div class="drum-name">DAYAN</div>
            <small>Right Tabla | Keyboard: A</small>
        </div>

        <div class="drum bayan" id="bayan" onclick="playTabla('ge')">
            <div class="drum-head"></div>
            <div class="drum-name">BAYAN</div>
            <small>Left Tabla | Keyboard: S</small>
        </div>

    </div>

    <div class="section">
        <h2>Tabla Bols</h2>
        <div class="bols">
            <button class="bol" onclick="playTabla('na')">NA (A)</button>
            <button class="bol" onclick="playTabla('tin')">TIN (D)</button>
            <button class="bol" onclick="playTabla('ta')">TA (F)</button>
            <button class="bol" onclick="playTabla('tun')">TUN (G)</button>
            <button class="bol" onclick="playTabla('ge')">GE (S)</button>
            <button class="bol" onclick="playTabla('ke')">KE (K)</button>
            <button class="bol" onclick="playTabla('dha')">DHA (J)</button>
            <button class="bol" onclick="playTabla('dhin')">DHIN (L)</button>
        </div>
    </div>

    <div class="section">
        <h2>Taal Selection</h2>
        <div class="actions">
            <select id="taal">
                <option value="teentaal">Teentaal - 16 Beats</option>
                <option value="keherwa">Keherwa - 8 Beats</option>
                <option value="dadra">Dadra - 6 Beats</option>
            </select>
            <button onclick="playBeat()">Play Taal</button>
        </div>
        <p id="status">Ready to play!</p>
    </div>

    <div class="section">
        <h2>Recording</h2>
        <div class="actions">
            <button onclick="startRecording()">● Record</button>
            <button onclick="stopRecording()">■ Stop Recording</button>
            <button onclick="replayRecording()">▶ Replay</button>
            <button onclick="clearRecording()">Clear</button>
        </div>
        <p id="recordStatus">No recording yet.</p>
    </div>

</div>

<footer>
    Professional Tabla Studio | HTML CSS JavaScript
</footer>

<script>
let audio;
let recording = [];
let isRecording = false;
let metronome = false;
let beatTimer = null;
let recordStart = 0;
let replayTimer = null;

function initAudio() {
    if (!audio) {
        audio = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audio.state === "suspended") audio.resume();
}

// Generate percussion tones using Web Audio
function sound(frequency, duration, type="sine", volume=.5) {
    initAudio();

    const osc = audio.createOscillator();
    const gain = audio.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(frequency, audio.currentTime);

    if(type === "sine") {
        osc.frequency.exponentialRampToValueAtTime(
            Math.max(40, frequency * .65),
            audio.currentTime + duration
        );
    }

    gain.gain.setValueAtTime(volume, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        .001, audio.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();
    osc.stop(audio.currentTime + duration);
}

const bols = {
    na:  [260, .15, "triangle"],
    tin: [520, .25, "sine"],
    ta:  [350, .12, "triangle"],
    tun: [420, .30, "sine"],
    ge:  [95, .35, "sine"],
    ke:  [160, .10, "triangle"],
    dha: [210, .30, "sine"],
    dhin:[390, .30, "sine"]
};

function playTabla(bol, save=true) {
    initAudio();

    const data = bols[bol];
    if(!data) return;

    sound(data[0], data[1], data[2], .6);

    if(bol === "dha" || bol === "dhin") {
        sound(95, .3, "sine", .4);
    }

    if(save && isRecording) {
        recording.push({
            bol: bol,
            time: Date.now() - recordStart
        });
    }

    const element = document.getElementById(
        bol === "ge" || bol === "ke" ? "bayan" : "dayan"
    );

    element.classList.add("active");
    setTimeout(() => element.classList.remove("active"), 120);
}

// Keyboard controls
document.addEventListener("keydown", e => {
    if(e.repeat) return;

    const keys = {
        a:"na", d:"tin", f:"ta", g:"tun",
        s:"ge", k:"ke", j:"dha", l:"dhin"
    };

    if(keys[e.key.toLowerCase()]) {
        playTabla(keys[e.key.toLowerCase()]);
    }
});

// Tempo control
const tempo = document.getElementById("tempo");

tempo.addEventListener("input", () => {
    document.getElementById("tempoValue").textContent =
        tempo.value + " BPM";
});

// Taal patterns
const patterns = {
    teentaal: [
        "dha","dhin","dhin","dha",
        "dha","dhin","dhin","dha",
        "dha","tin","tin","ta",
        "ta","dhin","dhin","dha"
    ],
    keherwa: [
        "dha","ge","na","ti",
        "na","ka","dhin","na"
    ],
    dadra: [
        "dha","dhin","na",
        "dha","tin","na"
    ]
};

function playBeat() {
    stopBeat();

    const pattern = patterns[
        document.getElementById("taal").value
    ];

    let index = 0;

    document.getElementById("status").textContent =
        "Playing " + document.getElementById("taal").selectedOptions[0].text;

    beatTimer = setInterval(() => {
        playTabla(pattern[index], false);
        index = (index + 1) % pattern.length;
    }, 60000 / Number(tempo.value));
}

function stopBeat() {
    clearInterval(beatTimer);
    beatTimer = null;
    document.getElementById("status").textContent = "Playback stopped.";
}

function toggleMetronome() {
    metronome = !metronome;

    document.getElementById("metroBtn").textContent =
        metronome ? "Metronome ON" : "Metronome OFF";

    if(metronome) {
        metroTick();
    } else {
        clearInterval(window.metroTimer);
    }
}

function metroTick() {
    clearInterval(window.metroTimer);

    if(metronome) {
        sound(1000, .04, "sine", .3);

        window.metroTimer = setInterval(() => {
            sound(1000, .04, "sine", .3);
        }, 60000 / Number(tempo.value));
    }
}

// Recording functions
function startRecording() {
    stopBeat();
    recording = [];
    isRecording = true;
    recordStart = Date.now();

    document.getElementById("recordStatus").textContent =
        "Recording in progress...";
}

function stopRecording() {
    isRecording = false;

    document.getElementById("recordStatus").textContent =
        recording.length + " strokes recorded.";
}

function replayRecording() {
    stopRecording();
    clearTimeout(replayTimer);

    if(!recording.length) {
        alert("No recording available!");
        return;
    }

    let i = 0;

    function next() {
        if(i >= recording.length) return;

        const item = recording[i];
        playTabla(item.bol, false);

        i++;

        if(i < recording.length) {
            replayTimer = setTimeout(
                next,
                recording[i].time - item.time
            );
        }
    }

    next();
}

function clearRecording() {
    stopRecording();
    clearTimeout(replayTimer);
    recording = [];

    document.getElementById("recordStatus").textContent =
        "Recording cleared.";
}
</script>

</body>
</html>
